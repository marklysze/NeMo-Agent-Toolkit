# AG2 ConversableAgent demo workflow

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/llama-3.3-nemotron-super-49b-v1.5
    api_key: FILL-THIS-OUT
    temperature: 0.0
    max_tokens: 1024

functions:
  current_datetime:
    _type: current_datetime

workflow:
  _type: ag2_conversable_agent
  llm_name: nim_llm
  tool_names: [current_datetime]
  system_prompt: "You are a helpful assistant. Use your tools when needed. Keep answers concise."
  max_turns: 5
  verbose: false
